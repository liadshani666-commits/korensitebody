<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תוכנית האימונים של ליאור</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#0b1424;--mute:#5a6678;--line:#dbe2ec;--hero:#0b1424;--str:#2456f5;--run:#0e9068;--rest:#64707f;--acc:var(--str);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d16;--card:#131c2b;--ink:#f0f4fa;--mute:#9fabbd;--line:#25324a;--hero:#0e1726;--str:#6b93ff;--run:#38c793;--rest:#93a0b3}}
:root[data-theme="dark"]{--bg:#080d16;--card:#131c2b;--ink:#f0f4fa;--mute:#9fabbd;--line:#25324a;--hero:#0e1726;--str:#6b93ff;--run:#38c793;--rest:#93a0b3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;font-size:19px;line-height:1.5}
.top{background:var(--hero);color:#fff;padding:22px 16px 84px}
.wrap{max-width:680px;margin:0 auto}
.top h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.3px}
.top p{margin:2px 0 0;color:#a9b6cc;font-size:17px}
main{max-width:680px;margin:-64px auto 0;padding:0 14px 48px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 8px 24px rgba(8,20,45,.14)}
.day{border:0;background:none;color:var(--ink);border-radius:12px;padding:8px 0 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.day small{font-size:12px;color:var(--mute);min-height:16px;font-weight:600}
.day b{font-size:22px;font-weight:800}
.day i{width:22px;height:5px;border-radius:3px;background:var(--c)}
.day[aria-selected="true"]{background:var(--c)}
.day[aria-selected="true"] b,.day[aria-selected="true"] small{color:#fff}
.day[aria-selected="true"] i{background:#fff}
:root[data-theme="dark"] .day[aria-selected="true"] b,:root[data-theme="dark"] .day[aria-selected="true"] small{color:#0b1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .day[aria-selected="true"] b,:root:not([data-theme="light"]) .day[aria-selected="true"] small{color:#0b1424}}
.day:focus-visible,.vid:focus-visible,.reset:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.head{margin:22px 4px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.head h2{margin:0;font-size:34px;font-weight:900;line-height:1.1}
.head span{color:var(--mute);font-size:18px;font-weight:600}
.chip{flex:none;background:var(--acc);color:#fff;font-weight:800;border-radius:10px;padding:4px 14px;font-size:17px}
:root[data-theme="dark"] .chip{color:#0b1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{color:#0b1424}}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:0 4px 6px}
.bar div{height:100%;width:0;background:var(--acc);transition:width .3s}
.pt{margin:0 4px 6px;color:var(--mute);font-size:16px;font-weight:600}
.grp{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:16px;overflow:hidden}
.gh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);border-right:6px solid var(--acc)}
.gh h3{margin:0;font-size:24px;font-weight:800}
.gh small{color:var(--mute);font-size:17px;font-weight:600}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex input{width:30px;height:30px;accent-color:var(--acc);margin:0}
.nm{font-size:21px;font-weight:600;line-height:1.3}
.ex input:checked~.nm{color:var(--mute);text-decoration:line-through;font-weight:400}
.ex.on{background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.vid{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff;text-decoration:none;font-weight:800;font-size:16px;border-radius:999px;padding:8px 14px;white-space:nowrap}
:root[data-theme="dark"] .vid{color:#0b1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vid{color:#0b1424}}
.vid svg{width:16px;height:16px;fill:currentColor}
.note{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;font-size:21px;margin-top:16px}
.reset{margin:18px 4px 0;font:inherit;font-size:17px;font-weight:600;background:none;border:1px solid var(--line);color:var(--mute);border-radius:12px;padding:8px 16px;cursor:pointer}

body{background:#0b0f16}

.top{background:transparent}
.head h2,.head span,.top h1{color:#fff}
.head span,.top p{color:#c3cddd}
.pt{color:#c3cddd}
.bar{background:rgba(255,255,255,.22)}
.reset{color:#e6ecf5;border-color:rgba(255,255,255,.35);background:rgba(8,12,20,.35)}
.week{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(6px)}

html:root:not([data-theme="zz"]){--ink:#ff8a1f;--mute:#ffb56b;--card:#0e131c;--line:rgba(255,138,31,.32);--str:#ff7a00;--run:#ffab3d;--rest:#c97a2e;--acc:var(--str)}
html:root:not([data-theme="zz"]) body{color:#ff8a1f}
html:root:not([data-theme="zz"]) .top h1,html:root:not([data-theme="zz"]) .head h2{color:#ff8a1f}
html:root:not([data-theme="zz"]) .top p,html:root:not([data-theme="zz"]) .head span,html:root:not([data-theme="zz"]) .pt{color:#ffb56b}
html:root:not([data-theme="zz"]) .day[aria-selected="true"] b,html:root:not([data-theme="zz"]) .day[aria-selected="true"] small{color:#140a02}
html:root:not([data-theme="zz"]) .day[aria-selected="true"] i{background:#140a02}
html:root:not([data-theme="zz"]) .chip,html:root:not([data-theme="zz"]) .vid{color:#140a02}
html:root:not([data-theme="zz"]) .week,html:root:not([data-theme="zz"]) .grp,html:root:not([data-theme="zz"]) .note{background:rgba(10,14,22,.58);border-color:rgba(255,138,31,.35)}
html:root:not([data-theme="zz"]) .bar{background:rgba(255,138,31,.22)}
html:root:not([data-theme="zz"]) .ex.on{background:rgba(255,138,31,.1)}
html:root:not([data-theme="zz"]) .reset{color:#ff8a1f;border-color:rgba(255,138,31,.5)}
html:root:not([data-theme="zz"]) .day:focus-visible,html:root:not([data-theme="zz"]) .vid:focus-visible,html:root:not([data-theme="zz"]) .reset:focus-visible{outline-color:#ffb56b}
html:root:not([data-theme="zz"]) .top .motto{color:#ff8a1f;font-size:22px;font-weight:800;margin-top:10px}

html:root:not([data-theme="zz"]) .tp,html:root:not([data-theme="zz"]) .grp .ws{text-align:center}
.tp{background:rgba(10,14,22,.58);border:1px solid rgba(255,138,31,.35);border-radius:18px;padding:18px;margin-top:16px;text-align:center}
.tl,.vl{color:#ffb56b;font-size:18px;font-weight:600}
.tm{font-size:60px;font-weight:900;color:#ff8a1f;font-variant-numeric:tabular-nums;line-height:1.1;direction:ltr}
.tb{margin:10px 0 4px;font:inherit;font-size:22px;font-weight:800;background:#ff8a1f;color:#140a02;border:0;border-radius:14px;padding:12px 32px;cursor:pointer}
.tb.stop{background:#ff5a1f}
.tb:focus-visible{outline:3px solid #ffb56b;outline-offset:2px}
.tn{margin:4px 0;color:#ffb56b;font-weight:600}
.vl{margin-top:16px}
.vv{font-size:38px;font-weight:900;color:#ff8a1f}
.cp{margin:6px 8px 4px;font-size:20px;font-weight:600;color:#ffb56b;min-height:1.4em}
.ex .in{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:600;color:#ffb56b}
.ex .in input{width:88px;height:46px;font:inherit;font-size:22px;font-weight:800;text-align:center;color:#ff8a1f;background:rgba(255,138,31,.1);border:2px solid rgba(255,138,31,.5);border-radius:12px;margin:0}
.ex .in input:focus-visible{outline:3px solid #ffb56b;outline-offset:1px}
.pv{font-size:16px;color:#ffb56b;font-weight:600;padding-bottom:10px}
.ws{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px 0}
.ws b{display:block;font-size:30px;font-weight:900;color:#ff8a1f}
.ws span{color:#ffb56b;font-size:16px;font-weight:600}
html{background:#0b0f16}
.tp,.grp,.note,.week{backdrop-filter:blur(3px)}

.tb.ghost{background:transparent;color:#ff8a1f;border:2px solid #ff8a1f;font-size:18px;padding:8px 22px;margin-top:8px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:680px;max-height:94vh;overflow-y:auto;background:#120b06;border:1px solid rgba(255,138,31,.45);border-bottom:0;border-radius:30px 30px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));text-align:center;color:#ff8a1f;animation:up .3s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:60px;height:6px;border-radius:3px;background:rgba(255,138,31,.5);margin:0 auto 10px}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.sl::-webkit-scrollbar{display:none}
.sp{flex:0 0 100%;scroll-snap-align:start;padding:0 2px}
.sp h2{margin:6px 0;font-size:32px;font-weight:900;color:#ff8a1f}
.hint,.lk{font:inherit;background:none;border:0;color:#ffb56b;font-size:18px;font-weight:600;cursor:pointer;padding:6px}
.lk{text-decoration:underline;font-size:20px;margin-top:10px;color:#ff8a1f;font-weight:800}
.hint:focus-visible,.lk:focus-visible{outline:3px solid #ffb56b}
.rw{position:relative;width:210px;height:210px;margin:12px auto}
.rw svg{width:100%;height:100%}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc b{font-size:34px;font-weight:900;direction:ltr;font-variant-numeric:tabular-nums}
.rc span{color:#ffb56b;font-size:17px}
.rh{display:flex;justify-content:space-between;align-items:center;margin:8px 4px 12px}
.rh h3{margin:0;font-size:26px;font-weight:900}
.bd{background:rgba(255,138,31,.16);border:1px solid #ff8a1f;border-radius:999px;padding:4px 16px;font-size:22px;font-weight:800}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:rgba(255,138,31,.08);border:1px solid rgba(255,138,31,.35);border-radius:16px;padding:12px 4px}
.st b{display:block;font-size:24px;font-weight:900}
.st span{color:#ffb56b;font-size:15px;font-weight:600}
.dl{margin-top:10px;text-align:right}
.dr{display:flex;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,138,31,.25);font-size:17px}
.dr em{font-style:normal;color:#ffb56b;white-space:nowrap}
.big{font-size:54px;font-weight:900;margin:14px 0 4px}
.vs{color:#ffb56b;font-size:19px;font-weight:600}
.wkb{margin-top:16px;background:rgba(255,138,31,.08);border:1px solid rgba(255,138,31,.35);border-radius:16px;padding:12px}
.wkb span{color:#ffb56b;font-weight:600}
.wkb b{display:block;font-size:30px;font-weight:900}
.dots{display:flex;justify-content:center;gap:8px;margin:12px 0 2px}
.dots i{width:12px;height:12px;border-radius:6px;background:rgba(255,138,31,.3)}
.dots i.on{width:30px;background:#ff8a1f}
.sheet .tb{width:100%;margin-top:10px}

v.innerHTML=h;
v.querySelectorAll("input[type=checkbox]").forEach(function(i){i.onchange=function(){P.done[K(i.dataset.id)]=i.checked;save();var r=i.closest(".ex");if(r)r.classList.toggle("on",i.checked);prog()}});
v.querySelectorAll(".in input").forEach(function(i){i.oninput=function(){var k=K(i.dataset.id),e=P.log[k]||(P.log[k]={});e[i.dataset.f]=parseFloat(i.value)||0;save();upd()}});
var tb=document.getElementById("tb");if(tb)tb.onclick=function(){var was=isRun();if(isRun()){P.time[K(sel)]=el();P.start=null}else{delete P.time[K(sel)];P.start={wk:wk,day:sel,ts:Date.now()}}save();draw();if(was)showSummary(sel)};
var sm=document.getElementById("sm");if(sm)sm.onclick=function(){showSummary(sel)};
var rb=v.querySelector(".reset");if(rb)rb.onclick=function(){var pre=wk+"|"+sel+"-";[P.done,P.log].forEach(function(o){Object.keys(o).forEach(function(k){if(k.indexOf(pre)==0)delete o[k]})});delete P.time[K(sel)];if(isRun())P.start=null;save();draw()};
prog();upd()}
function prog(){var f=document.getElementById("fill");if(!f)return;var a=document.querySelectorAll("#view .ex input[type=checkbox]"),n=0;
a.forEach(function(i){if(i.checked)n++});f.style.width=(a.length?n/a.length*100:0)+"%";
document.getElementById("pt").textContent="בוצעו "+n+" מתוך "+a.length+(n==a.length?" – כל הכבוד!":"")}
setInterval(function(){var t=document.getElementById("tm");if(t&&isRun())t.textContent=fmtT(el())},1000);
function sumDay(i,w){var r={k:0,s:0,r:0,done:0,n:0,rows:[]};D[i].g.forEach(function(g,gi){g[1].forEach(function(x,xi){var id=i+"-"+gi+"-"+xi,e=P.log[w+"|"+id]||{},k=e.k||0,s=e.s==null?3:e.s,rp=e.r==null?8:e.r,dn=!!P.done[w+"|"+id];r.n++;if(dn)r.done++;if(dn||k>0){r.s+=s;r.r+=s*rp}if(k>0)r.k+=k;r.rows.push({n:x[0],k:k,s:s,r:rp,d:dn})})});return r}
function closeSum(){var o=document.getElementById("ov");if(o)o.remove();document.removeEventListener("keydown",esc)}
function esc(e){if(e.key=="Escape")closeSum()}
function tile(v,l){return '<div class="st"><b>'+v+'</b><span>'+l+'</span></div>'}
function showSummary(i){var w=wk,S=sumDay(i,w),t=P.time[w+"|"+i]||0,pct=S.n?Math.round(S.done/S.n*100):0,L=2*Math.PI*70,pv=dayVol(i,pwk),df=S.k-pv;
closeSum();var o=document.createElement("div");o.id="ov";o.className="ov";
var det=S.rows.map(function(r){return '<div class="dr"><span>'+(r.d?"✓ ":"")+r.n+'</span><em>'+(r.k?fmtN(r.k)+' ק"ג':(r.d?"בוצע":"דולג"))+'</em></div>'}).join("");
var vs=pv>0?(df>=0?"+":"−")+fmtN(Math.abs(df))+' ק"ג לעומת שבוע שעבר':"אין נתוני שבוע שעבר להשוואה";
o.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="סיכום אימון"><div class="grab"></div><div class="sl" id="sl">'+
'<div class="sp"><h2>משימה הושגה!</h2><button class="hint" id="hn">החלק לראות השוואת משקל ›</button>'+
'<div class="rw"><svg viewBox="0 0 180 180" aria-hidden="true"><circle cx="90" cy="90" r="70" fill="none" stroke="rgba(255,138,31,.2)" stroke-width="14"/><circle cx="90" cy="90" r="70" fill="none" stroke="#ff8a1f" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+(L*pct/100)+' '+L+'" transform="rotate(-90 90 90)"/></svg><div class="rc"><b>'+fmtT(t)+'</b><span>זמן כולל</span></div></div>'+
'<div class="rh"><h3>השלמה כוללת</h3><span class="bd">'+pct+'%</span></div>'+
'<div class="sg">'+tile(fmtN(S.k)+' ק"ג','משקל כולל')+tile(S.r,'סה"כ חזרות')+tile(S.s,'סה"כ סטים')+tile(fmtT(t),'זמן')+tile(S.done,'סיימו')+tile(S.n-S.done,'דולג')+'</div>'+
'<button class="lk" id="dt">הצג פרטים</button><div class="dl" id="dl" hidden>'+det+'</div></div>'+
'<div class="sp"><h2>השוואת משקל</h2><div class="big">'+fmtN(S.k)+' ק"ג</div><p class="cp">'+(cmp(S.k)||"רשום משקל בתרגילים כדי לראות השוואה")+'</p><p class="vs">'+vs+'</p><div class="wkb"><span>סיכום השבוע</span><b>'+fmtN(weekVol())+' ק"ג</b><p class="cp">'+cmp(weekVol())+'</p></div></div>'+
'</div><div class="dots"><i class="on"></i><i></i></div><button class="tb" id="cl">סגור</button></div>';
document.body.appendChild(o);
var sl=document.getElementById("sl"),ds=o.querySelectorAll(".dots i");
sl.onscroll=function(){var n=Math.round(Math.abs(sl.scrollLeft)/sl.clientWidth);ds[0].className=n?"":"on";ds[1].className=n?"on":""};
document.getElementById("hn").onclick=function(){sl.children[1].scrollIntoView({behavior:"smooth",inline:"start",block:"nearest"})};
document.getElementById("dt").onclick=function(){var d=document.getElementById("dl");d.hidden=!d.hidden;this.textContent=d.hidden?"הצג פרטים":"הסתר פרטים"};
document.getElementById("cl").onclick=closeSum;o.onclick=function(e){if(e.target==o)closeSum()};
document.addEventListener("keydown",esc);document.getElementById("cl").focus()}
draw();
</script>
</body>
</html>
